# GHOST broker. LAN/hotspot demo: no TLS, no auth (see CLAUDE.md "Security posture").
persistence false
log_dest stdout
log_type warning
log_type error
log_type notice

# Plain MQTT: python nodes, brain, tools/
listener 1883
protocol mqtt
allow_anonymous true

# Websockets: dashboard and node-web/ browser nodes.
# Must be its own listener block with its own protocol line.
listener 9001
protocol websockets
allow_anonymous true
