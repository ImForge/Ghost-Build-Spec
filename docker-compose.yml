# GHOST — infrastructure only. The brain, nodes and dashboard run on the host.
#   docker compose up -d mosquitto          # always needed
#   docker compose --profile llm up -d      # optional local LLM/VLM
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ghost-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (nodes, brain, tools)
      - "9001:9001"   # MQTT over websockets (dashboard, web nodes)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ollama:
    image: ollama/ollama
    container_name: ghost-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    profiles: ["llm"]

volumes:
  ollama:
